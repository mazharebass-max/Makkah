name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haramain
          POSTGRES_PASSWORD: haramain
          POSTGRES_DB: haramain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haramain -d haramain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://haramain:haramain@localhost:5432/haramain?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-change-me-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32chars
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter @haramain/contracts build && pnpm --filter @haramain/ui build
      - name: Prisma generate & migrate
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit / security tests
        run: pnpm --filter @haramain/api test
      - name: Build apps
        run: pnpm --filter @haramain/api build && pnpm --filter @haramain/web build && pnpm --filter @haramain/admin build
